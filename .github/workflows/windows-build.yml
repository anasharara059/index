name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: INDEX-Study-Assistant-Windows
          path: |
            dist/*.exe
            dist/*.zip
