<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDEX Desktop HUD</title>
  <style>
    :root {
      --gold: #d9a54a;
      --gold-glow: rgba(217, 165, 74, 0.4);
      --pill-bg: rgba(12, 14, 20, 0.94);
      --pill-border: rgba(217, 165, 74, 0.42);
      --time-color: #d9a54a;
      --label-color: #9ca3af;
      --warning: #f59e0b;
      --success: #10b981;
      --track-bg: rgba(255, 255, 255, 0.12);
      --btn-hover: rgba(255, 255, 255, 0.12);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.55), 0 0 12px rgba(217, 165, 74, 0.12);
    }

    /* Light Theme accommodation - High Contrast & Warm Elegance */
    body.theme-light {
      --gold: #b37e22;
      --gold-glow: rgba(179, 126, 34, 0.3);
      --pill-bg: rgba(255, 255, 255, 0.97);
      --pill-border: rgba(179, 126, 34, 0.52);
      --time-color: #6b4507;
      --label-color: #5c4d3c;
      --warning: #d97706;
      --success: #059669;
      --track-bg: rgba(0, 0, 0, 0.10);
      --btn-hover: rgba(0, 0, 0, 0.08);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 230px;
      height: 46px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    #hud-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* -------------------------------------------------------------
       THE CAPSULE PILL
       Compact: ~2.5 cm (146px width × 36px height)
       Expanded: 218px width with inline action tools
       ------------------------------------------------------------- */
    #timer-pill {
      height: 36px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7px 0 9px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
      cursor: grab;
      -webkit-app-region: drag;
      transition: width 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.2s ease,
                  border-color 0.2s ease,
                  box-shadow 0.2s ease;
      opacity: 0.82;
      width: 146px;
    }

    #timer-pill:active {
      cursor: grabbing;
    }

    /* Hover effect: instant full brightness and gentle glow */
    #timer-pill:hover,
    #timer-pill.expanded {
      opacity: 1;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 0 14px rgba(217, 165, 74, 0.22);
    }

    /* Expanded state reveals inline toolbar */
    #timer-pill.expanded {
      width: 218px;
    }

    /* -------------------------------------------------------------
       STATUS DOT / PLAY-PAUSE TRIGGER
       ------------------------------------------------------------- */
    #status-btn {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
      border-radius: 50%;
      transition: background 0.15s ease;
      flex-shrink: 0;
    }

    #status-btn:hover {
      background: var(--btn-hover);
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.7);
      transition: all 0.2s ease;
    }

    .paused #status-dot {
      background: var(--warning);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
    }

    /* -------------------------------------------------------------
       DIGITAL TIME NUMBERS
       ------------------------------------------------------------- */
    #time-display {
      font-family: "SF Mono", Monaco, Consolas, "Courier New", monospace;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--time-color);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: color 0.18s ease;
      direction: ltr;
      user-select: none;
      padding: 0 2px;
    }

    .paused #time-display {
      color: var(--warning);
    }

    /* -------------------------------------------------------------
       INLINE ACTION TOOLS (Slide into view when 3-dots clicked)
       ------------------------------------------------------------- */
    #action-tools {
      display: flex;
      align-items: center;
      gap: 2px;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-width 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.18s ease,
                  margin 0.22s ease;
      -webkit-app-region: no-drag;
      margin: 0;
    }

    #timer-pill.expanded #action-tools {
      max-width: 84px;
      opacity: 1;
      margin: 0 3px;
    }

    .tool-btn {
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--label-color);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.14s ease;
      padding: 0;
      font-size: 11px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .tool-btn:hover {
      background: var(--btn-hover);
      color: var(--gold);
      transform: scale(1.12);
    }

    .tool-btn.danger:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    /* Three Dots Button */
    #dots-toggle-btn {
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--label-color);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      padding: 0;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    #dots-toggle-btn:hover {
      background: var(--btn-hover);
      color: var(--gold);
    }

    #dots-toggle-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    #timer-pill.expanded #dots-toggle-btn {
      color: var(--gold);
      background: var(--btn-hover);
      transform: rotate(90deg);
    }

    /* -------------------------------------------------------------
       MICRO-PROGRESS TRACK (Strictly inside the capsule pill)
       ------------------------------------------------------------- */
    #progress-line {
      position: absolute;
      bottom: 0;
      left: 10px;
      right: 10px;
      height: 2px;
      background: var(--track-bg);
      border-radius: 2px;
      overflow: hidden;
      pointer-events: none;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #d9a54a);
      border-radius: 2px;
      transition: width 0.35s ease;
    }

    /* Session Completed Flash */
    #timer-pill.is-session-completed {
      border-color: #10b981;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.75);
    }
  </style>
</head>
<body>
  <div id="hud-wrapper">
    <!-- The Compact 2.5cm Capsule -->
    <div id="timer-pill" title="اسحب للتحريك أو انقر للتشغيل/الإيقاف">
      <!-- Status Indicator / Play-Pause -->
      <div id="status-btn" title="تشغيل / إيقاف مؤقت">
        <span id="status-dot"></span>
      </div>

      <!-- Time Display -->
      <span id="time-display" title="انقر للتشغيل أو الإيقاف المؤقت">25:00</span>

      <!-- Inline Action Tools (revealed when 3-dots clicked) -->
      <div id="action-tools">
        <button id="tool-theme" class="tool-btn" type="button" title="تبديل الثيم (نهاري / ليلي)">☀️</button>
        <button id="tool-pin" class="tool-btn" type="button" title="إعادة التثبيت أعلى الشاشة (Dock Top)">📌</button>
        <button id="tool-close" class="tool-btn danger" type="button" title="إخفاء المؤقت">✕</button>
      </div>

      <!-- 3-Dots Button -->
      <button id="dots-toggle-btn" type="button" title="خيارات إضافية">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="5" r="2"></circle>
          <circle cx="12" cy="12" r="2"></circle>
          <circle cx="12" cy="19" r="2"></circle>
        </svg>
      </button>

      <!-- Micro-progress inside the pill -->
      <div id="progress-line">
        <div id="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    const timerPill = document.getElementById('timer-pill');
    const timeDisplay = document.getElementById('time-display');
    const statusBtn = document.getElementById('status-btn');
    const progressFill = document.getElementById('progress-fill');
    const dotsToggleBtn = document.getElementById('dots-toggle-btn');
    const toolTheme = document.getElementById('tool-theme');
    const toolPin = document.getElementById('tool-pin');
    const toolClose = document.getElementById('tool-close');

    let isExpanded = false;
    let isLightMode = false;
    let autoDimTimeout = null;

    // -------------------------------------------------------------
    //  GENTLE AUTO-DIMMING PHYSICS
    //  Pill is ALWAYS visible and tangible, never disappears off-screen!
    //  Dims gently when mouse leaves, wakes up to 100% on hover.
    // -------------------------------------------------------------
    function wakeUpPill() {
      clearTimeout(autoDimTimeout);
      timerPill.style.opacity = '1';
    }

    function scheduleGentleDim() {
      if (isExpanded) return;
      clearTimeout(autoDimTimeout);
      autoDimTimeout = setTimeout(() => {
        if (!isExpanded) {
          timerPill.style.opacity = '0.78';
        }
      }, 1500);
    }

    timerPill.addEventListener('mouseenter', wakeUpPill);
    timerPill.addEventListener('mouseleave', scheduleGentleDim);

    // -------------------------------------------------------------
    //  PLAY / PAUSE CONTROL
    // -------------------------------------------------------------
    function triggerPlayPause(e) {
      if (e) e.stopPropagation();
      if (timerPill.classList.contains('is-session-completed')) {
        timerPill.classList.remove('is-session-completed');
      }
      if (window.electronAPI && typeof window.electronAPI.togglePlayPause === 'function') {
        window.electronAPI.togglePlayPause();
      }
    }

    statusBtn.addEventListener('click', triggerPlayPause);
    timeDisplay.addEventListener('click', triggerPlayPause);

    // -------------------------------------------------------------
    //  THREE-DOTS EXPANDABLE INLINE TOOLBAR
    // -------------------------------------------------------------
    function toggleExpanded(e) {
      if (e) e.stopPropagation();
      isExpanded = !isExpanded;
      timerPill.classList.toggle('expanded', isExpanded);
      if (isExpanded) {
        wakeUpPill();
      } else {
        scheduleGentleDim();
      }
    }

    dotsToggleBtn.addEventListener('click', toggleExpanded);

    // Tool: Theme Toggle
    toolTheme.addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.electronAPI && typeof window.electronAPI.toggleTheme === 'function') {
        window.electronAPI.toggleTheme();
      } else {
        isLightMode = !isLightMode;
        document.body.classList.toggle('theme-light', isLightMode);
        toolTheme.textContent = isLightMode ? '🌙' : '☀️';
      }
    });

    // Tool: Reset Position (Dock Top)
    toolPin.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleExpanded();
      if (window.electronAPI && typeof window.electronAPI.resetMiniTimerPosition === 'function') {
        window.electronAPI.resetMiniTimerPosition();
      }
    });

    // Tool: Close / Hide HUD
    toolClose.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleExpanded();
      if (window.electronAPI && typeof window.electronAPI.hideMiniTimer === 'function') {
        window.electronAPI.hideMiniTimer();
      }
    });

    // Collapse when clicking outside the pill
    document.addEventListener('click', (e) => {
      if (isExpanded && (!e.target || typeof e.target.closest !== 'function' || !e.target.closest('#timer-pill'))) {
        isExpanded = false;
        timerPill.classList.remove('expanded');
        scheduleGentleDim();
      }
    });

    // -------------------------------------------------------------
    //  STATE SYNCHRONIZATION FROM MAIN WINDOW
    // -------------------------------------------------------------
    if (window.electronAPI && typeof window.electronAPI.onMiniTimerState === 'function') {
      window.electronAPI.onMiniTimerState((state) => {
        if (!state) return;

        // Format time (HH:MM:SS -> MM:SS if hours is 00)
        let timeStr = state.time || '25:00';
        if (timeStr.startsWith('00:')) {
          timeStr = timeStr.slice(3);
        }
        timeDisplay.textContent = timeStr;

        // Paused state
        timerPill.classList.toggle('paused', !!state.paused);

        // Progress bar (Strictly inside capsule)
        const pct = Number.isFinite(state.progress) ? Math.max(0, Math.min(100, state.progress)) : 0;
        progressFill.style.width = pct + '%';

        // Completion glow
        if (state.completed) {
          timerPill.classList.add('is-session-completed');
          progressFill.style.width = '100%';
          wakeUpPill();
        } else {
          timerPill.classList.remove('is-session-completed');
        }

        // Theme sync
        if (state.theme) {
          const wantsLight = state.theme === 'light';
          if (isLightMode !== wantsLight) {
            isLightMode = wantsLight;
            document.body.classList.toggle('theme-light', isLightMode);
            toolTheme.textContent = isLightMode ? '🌙' : '☀️';
            toolTheme.title = isLightMode ? 'التبديل إلى الوضع الليلي' : 'التبديل إلى الوضع النهاري';
          }
        }
      });
    }
  </script>
</body>
</html>
