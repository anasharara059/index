<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDEX Desktop HUD</title>
  <style>
    :root {
      --gold: #d9a54a;
      --gold-glow: rgba(217, 165, 74, 0.45);
      --pill-bg: rgba(12, 14, 20, 0.94);
      --pill-border: rgba(217, 165, 74, 0.42);
      --time-color: #d9a54a;
      --label-color: #9ca3af;
      --warning: #f59e0b;
      --success: #10b981;
      --track-bg: rgba(255, 255, 255, 0.12);
      --btn-hover: rgba(255, 255, 255, 0.10);
      --menu-bg: rgba(14, 17, 24, 0.96);
      --menu-border: rgba(217, 165, 74, 0.35);
      --menu-text: #e5e7eb;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }

    /* Light Theme accommodation - High Contrast & Warm Elegance */
    body.theme-light {
      --gold: #b37e22;
      --gold-glow: rgba(179, 126, 34, 0.35);
      --pill-bg: rgba(255, 255, 255, 0.96);
      --pill-border: rgba(179, 126, 34, 0.48);
      --time-color: #6b4507;
      --label-color: #5c4d3c;
      --warning: #d97706;
      --success: #059669;
      --track-bg: rgba(0, 0, 0, 0.10);
      --btn-hover: rgba(0, 0, 0, 0.07);
      --menu-bg: rgba(255, 255, 255, 0.97);
      --menu-border: rgba(179, 126, 34, 0.35);
      --menu-text: #2d2416;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 160px;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    #overlay-container {
      width: 160px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 0;
    }

    /* -------------------------------------------------------------
       TOP NOTCH ACCENT STRIP (when retracted at top screen edge)
       ------------------------------------------------------------- */
    #notch-strip {
      width: 48px;
      height: 5px;
      background: linear-gradient(90deg, #f59e0b, #d9a54a);
      border-radius: 0 0 4px 4px;
      box-shadow: 0 0 8px rgba(217, 165, 74, 0.6);
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.2s ease;
      opacity: 0.9;
    }

    /* -------------------------------------------------------------
       MAIN CAPSULE PILL (Fixed ~2.5 cm: 154px width × 36px height)
       ------------------------------------------------------------- */
    #timer-pill {
      width: 154px;
      height: 36px;
      min-width: 154px;
      max-width: 154px;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 10px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.18s ease, border-color 0.2s ease, background 0.2s ease;
      position: relative;
      cursor: grab;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    #timer-pill:active {
      cursor: grabbing;
    }

    /* Auto-Hide physics when pinned to top */
    #overlay-container.is-pinned-top:not(.is-always-visible) #timer-pill {
      transform: translateY(-38px);
      opacity: 0;
      pointer-events: none;
    }

    /* Drops down smoothly on hover or when revealed */
    #overlay-container.is-pinned-top:not(.is-always-visible):hover #timer-pill,
    #overlay-container.is-pinned-top:not(.is-always-visible).is-peek-revealed #timer-pill {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    #overlay-container.is-pinned-top:not(.is-always-visible):hover #notch-strip,
    #overlay-container.is-pinned-top:not(.is-always-visible).is-peek-revealed #notch-strip {
      opacity: 0;
    }

    /* Always visible state */
    #overlay-container.is-always-visible #timer-pill,
    #overlay-container:not(.is-pinned-top) #timer-pill {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    #overlay-container.is-always-visible #notch-strip,
    #overlay-container:not(.is-pinned-top) #notch-strip {
      display: none;
    }

    /* Status Pulse Dot */
    #status-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.7);
      transition: all 0.2s ease;
    }

    .paused #status-dot {
      background: var(--warning);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
    }

    /* Time Numbers */
    #time-display {
      font-family: "SF Mono", Monaco, Consolas, "Courier New", monospace;
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--time-color);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: color 0.18s ease;
      direction: ltr;
    }

    .paused #time-display {
      color: var(--warning);
    }

    /* Three Dots Button */
    #dots-btn {
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--label-color);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      padding: 0;
      -webkit-app-region: no-drag;
    }

    #dots-btn:hover {
      background: var(--btn-hover);
      color: var(--gold);
      transform: scale(1.1);
    }

    #dots-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Subtle Built-in Progress Bar (Strictly inside capsule - NEVER expands beyond 154px!) */
    #pill-progress-track {
      position: absolute;
      bottom: 0;
      left: 10px;
      right: 10px;
      height: 2px;
      background: var(--track-bg);
      border-radius: 2px;
      overflow: hidden;
      pointer-events: none;
    }

    #pill-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #d9a54a);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* -------------------------------------------------------------
       THREE-DOTS DROPDOWN MENU
       ------------------------------------------------------------- */
    #dots-menu {
      width: 154px;
      background: var(--menu-bg);
      border: 1px solid var(--menu-border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: absolute;
      top: 42px;
      left: 3px;
      padding: 4px;
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 500;
      -webkit-app-region: no-drag;
      animation: menuFadeIn 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #dots-menu.is-open {
      display: flex;
    }

    @keyframes menuFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      color: var(--menu-text);
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease;
      white-space: nowrap;
    }

    .menu-item:hover {
      background: var(--btn-hover);
      color: var(--gold);
    }

    .menu-item .menu-icon {
      font-size: 12px;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }

    .menu-divider {
      height: 1px;
      background: var(--track-bg);
      margin: 2px 4px;
    }

    /* Completion Glow */
    #timer-pill.is-session-completed {
      border-color: #10b981;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.75);
      animation: pulseCompleted 1.5s infinite alternate;
    }

    @keyframes pulseCompleted {
      from { box-shadow: 0 0 8px rgba(16, 185, 129, 0.5); }
      to { box-shadow: 0 0 20px rgba(16, 185, 129, 0.9); }
    }
  </style>
</head>
<body>
  <div id="overlay-container" class="is-pinned-top">
    <!-- Top Notch Accent Strip (Visible when collapsed at top edge) -->
    <div id="notch-strip" title="مرر الفأرة هنا لإظهار المؤقت"></div>

    <!-- The 2.5cm Capsule -->
    <div id="timer-pill" title="اسحب للتحريك أو انقر للتشغيل/الإيقاف">
      <!-- Status Indicator / Play-Pause -->
      <div id="status-wrapper" title="تشغيل / إيقاف مؤقت">
        <span id="status-dot"></span>
      </div>

      <!-- Time Display -->
      <span id="time-display" title="انقر للتشغيل أو الإيقاف المؤقت">25:00</span>

      <!-- 3-Dots Menu Button -->
      <button id="dots-btn" type="button" title="خيارات المؤقت">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="5" r="2"></circle>
          <circle cx="12" cy="12" r="2"></circle>
          <circle cx="12" cy="19" r="2"></circle>
        </svg>
      </button>

      <!-- Mini Progress Track inside the pill -->
      <div id="pill-progress-track">
        <div id="pill-progress-fill"></div>
      </div>
    </div>

    <!-- 3-Dots Dropdown Menu -->
    <div id="dots-menu">
      <div class="menu-item" id="menu-play-pause">
        <span class="menu-icon">⏯️</span>
        <span id="menu-play-text">تشغيل / إيقاف</span>
      </div>
      <div class="menu-item" id="menu-theme">
        <span class="menu-icon" id="menu-theme-icon">☀️</span>
        <span id="menu-theme-text">الوضع النهاري</span>
      </div>
      <div class="menu-item" id="menu-dock">
        <span class="menu-icon">📌</span>
        <span id="menu-dock-text">أعلى الشاشة</span>
      </div>
      <div class="menu-item" id="menu-always-visible">
        <span class="menu-icon">👁️</span>
        <span id="menu-visible-text">إظهار دائم</span>
      </div>
      <div class="menu-divider"></div>
      <div class="menu-item" id="menu-hide" style="color: #ef4444;">
        <span class="menu-icon">✕</span>
        <span>إخفاء المؤقت</span>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('overlay-container');
    const timerPill = document.getElementById('timer-pill');
    const timeDisplay = document.getElementById('time-display');
    const statusWrapper = document.getElementById('status-wrapper');
    const progressFill = document.getElementById('pill-progress-fill');
    const dotsBtn = document.getElementById('dots-btn');
    const dotsMenu = document.getElementById('dots-menu');
    const notchStrip = document.getElementById('notch-strip');

    // Menu Item Elements
    const menuPlayPause = document.getElementById('menu-play-pause');
    const menuPlayText = document.getElementById('menu-play-text');
    const menuTheme = document.getElementById('menu-theme');
    const menuThemeIcon = document.getElementById('menu-theme-icon');
    const menuThemeText = document.getElementById('menu-theme-text');
    const menuDock = document.getElementById('menu-dock');
    const menuDockText = document.getElementById('menu-dock-text');
    const menuAlwaysVisible = document.getElementById('menu-always-visible');
    const menuVisibleText = document.getElementById('menu-visible-text');
    const menuHide = document.getElementById('menu-hide');

    // State
    let isPinnedTop = localStorage.getItem('index_hud_pinned') !== 'false'; // default true
    let isAlwaysVisible = localStorage.getItem('index_hud_always_visible') === 'true'; // default false (hover drop-down)
    let isLightMode = false;
    let isMenuOpen = false;
    let retractTimeout = null;

    // Apply UI state
    function applyUIState() {
      container.classList.toggle('is-pinned-top', isPinnedTop);
      container.classList.toggle('is-always-visible', isAlwaysVisible);
      document.body.classList.toggle('theme-light', isLightMode);

      menuDockText.textContent = isPinnedTop ? 'سحب حر (Float)' : 'تثبيت بالأعلى (Dock)';
      menuVisibleText.textContent = isAlwaysVisible ? 'إخفاء تلقائي (Auto-Hide)' : 'إظهار دائم (Always On)';
      menuThemeIcon.textContent = isLightMode ? '🌙' : '☀️';
      menuThemeText.textContent = isLightMode ? 'الوضع الليلي' : 'الوضع النهاري';

      if (!isPinnedTop) {
        // Free float: make sure it's visible and window is expanded
        if (window.electronAPI && typeof window.electronAPI.setCollapsedState === 'function') {
          window.electronAPI.setCollapsedState(false);
        }
      } else if (isAlwaysVisible) {
        if (window.electronAPI && typeof window.electronAPI.setCollapsedState === 'function') {
          window.electronAPI.setCollapsedState(false);
        }
      } else {
        // Pinned top with auto-hide
        if (!container.classList.contains('is-peek-revealed') && !isMenuOpen) {
          if (window.electronAPI && typeof window.electronAPI.setCollapsedState === 'function') {
            window.electronAPI.setCollapsedState(true);
          }
        }
      }
    }

    applyUIState();

    // -------------------------------------------------------------
    //  SMOOTH HOVER & AUTO-HIDE PHYSICS
    // -------------------------------------------------------------
    function revealCapsule() {
      clearTimeout(retractTimeout);
      if (window.electronAPI && typeof window.electronAPI.setCollapsedState === 'function') {
        window.electronAPI.setCollapsedState(false);
      }
      container.classList.add('is-peek-revealed');
    }

    function scheduleRetract() {
      if (!isPinnedTop || isAlwaysVisible || isMenuOpen) return;
      clearTimeout(retractTimeout);
      // Wait 1.2 seconds after mouse leaves before retracting
      retractTimeout = setTimeout(() => {
        container.classList.remove('is-peek-revealed');
        // Wait for CSS slide-up animation (220ms) then collapse window
        setTimeout(() => {
          if (!container.classList.contains('is-peek-revealed') && !isMenuOpen) {
            if (window.electronAPI && typeof window.electronAPI.setCollapsedState === 'function') {
              window.electronAPI.setCollapsedState(true);
            }
          }
        }, 230);
      }, 1200);
    }

    container.addEventListener('mouseenter', revealCapsule);
    container.addEventListener('mouseleave', scheduleRetract);
    notchStrip.addEventListener('mouseenter', revealCapsule);

    // -------------------------------------------------------------
    //  PLAY / PAUSE CONTROL
    // -------------------------------------------------------------
    function triggerPlayPause(e) {
      if (e) e.stopPropagation();
      if (timerPill.classList.contains('is-session-completed')) {
        timerPill.classList.remove('is-session-completed');
      }
      if (window.electronAPI && typeof window.electronAPI.togglePlayPause === 'function') {
        window.electronAPI.togglePlayPause();
      }
    }

    statusWrapper.addEventListener('click', triggerPlayPause);
    timeDisplay.addEventListener('click', triggerPlayPause);
    menuPlayPause.addEventListener('click', (e) => {
      triggerPlayPause(e);
      closeMenu();
    });

    // -------------------------------------------------------------
    //  THREE-DOTS MENU CONTROLS
    // -------------------------------------------------------------
    function openMenu() {
      isMenuOpen = true;
      dotsMenu.classList.add('is-open');
      revealCapsule();
      if (window.electronAPI && typeof window.electronAPI.setOverlayMenuOpen === 'function') {
        window.electronAPI.setOverlayMenuOpen(true);
      }
    }

    function closeMenu() {
      isMenuOpen = false;
      dotsMenu.classList.remove('is-open');
      if (window.electronAPI && typeof window.electronAPI.setOverlayMenuOpen === 'function') {
        window.electronAPI.setOverlayMenuOpen(false);
      }
      scheduleRetract();
    }

    dotsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isMenuOpen) closeMenu();
      else openMenu();
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if (isMenuOpen && !e.target.closest('#dots-menu') && !e.target.closest('#dots-btn')) {
        closeMenu();
      }
    });

    // Menu Item: Theme Toggle
    menuTheme.addEventListener('click', (e) => {
      e.stopPropagation();
      closeMenu();
      if (window.electronAPI && typeof window.electronAPI.toggleTheme === 'function') {
        window.electronAPI.toggleTheme();
      } else {
        isLightMode = !isLightMode;
        applyUIState();
      }
    });

    // Menu Item: Dock Top / Float
    menuDock.addEventListener('click', (e) => {
      e.stopPropagation();
      closeMenu();
      isPinnedTop = !isPinnedTop;
      localStorage.setItem('index_hud_pinned', isPinnedTop);
      applyUIState();
      if (window.electronAPI && typeof window.electronAPI.pinMiniTimerTop === 'function') {
        window.electronAPI.pinMiniTimerTop(isPinnedTop);
      }
    });

    // Menu Item: Always Visible / Auto-Hide
    menuAlwaysVisible.addEventListener('click', (e) => {
      e.stopPropagation();
      closeMenu();
      isAlwaysVisible = !isAlwaysVisible;
      localStorage.setItem('index_hud_always_visible', isAlwaysVisible);
      applyUIState();
    });

    // Menu Item: Hide HUD
    menuHide.addEventListener('click', (e) => {
      e.stopPropagation();
      closeMenu();
      if (window.electronAPI && typeof window.electronAPI.hideMiniTimer === 'function') {
        window.electronAPI.hideMiniTimer();
      }
    });

    // -------------------------------------------------------------
    //  FREE DRAGGING SUPPORT (when unpinned)
    // -------------------------------------------------------------
    let dragging = false;
    let startMouseX = 0;
    let startMouseY = 0;
    let startWindowX = 0;
    let startWindowY = 0;

    timerPill.addEventListener('mousedown', async (e) => {
      if (e.target.closest('#dots-btn') || e.target.closest('#status-wrapper') || e.target.closest('#time-display') || isMenuOpen) return;
      if (isPinnedTop) {
        // If user drags while pinned, unpin
        isPinnedTop = false;
        localStorage.setItem('index_hud_pinned', false);
        applyUIState();
      }
      dragging = true;
      startMouseX = e.screenX;
      startMouseY = e.screenY;
      const pos = await window.electronAPI.getMiniTimerPosition();
      if (pos) {
        startWindowX = pos[0];
        startWindowY = pos[1];
      }
    });

    window.addEventListener('mousemove', async (e) => {
      if (!dragging) return;
      const x = startWindowX + (e.screenX - startMouseX);
      const y = startWindowY + (e.screenY - startMouseY);

      if (window.electronAPI && typeof window.electronAPI.snapMoveMiniTimer === 'function') {
        const result = await window.electronAPI.snapMoveMiniTimer(x, y);
        if (result && result.isPinnedTop) {
          isPinnedTop = true;
          localStorage.setItem('index_hud_pinned', true);
          applyUIState();
        }
      } else if (window.electronAPI && typeof window.electronAPI.moveMiniTimer === 'function') {
        window.electronAPI.moveMiniTimer(x, y);
      }
    });

    window.addEventListener('mouseup', () => { dragging = false; });

    // -------------------------------------------------------------
    //  STATE SYNCHRONIZATION FROM MAIN WINDOW
    // -------------------------------------------------------------
    if (window.electronAPI && typeof window.electronAPI.onMiniTimerState === 'function') {
      window.electronAPI.onMiniTimerState((state) => {
        if (!state) return;

        // Format time (HH:MM:SS -> MM:SS if hours is 00)
        let timeStr = state.time || '25:00';
        if (timeStr.startsWith('00:')) {
          timeStr = timeStr.slice(3);
        }
        timeDisplay.textContent = timeStr;

        // Paused state
        timerPill.classList.toggle('paused', !!state.paused);
        menuPlayText.textContent = state.running ? 'إيقاف مؤقت' : 'تشغيل العداد';

        // Progress bar (Strictly inside capsule)
        const pct = Number.isFinite(state.progress) ? Math.max(0, Math.min(100, state.progress)) : 0;
        progressFill.style.width = pct + '%';

        // Completion glow
        if (state.completed) {
          timerPill.classList.add('is-session-completed');
          progressFill.style.width = '100%';
          revealCapsule();
        } else {
          timerPill.classList.remove('is-session-completed');
        }

        // Theme sync
        if (state.theme) {
          const wantsLight = state.theme === 'light';
          if (isLightMode !== wantsLight) {
            isLightMode = wantsLight;
            applyUIState();
          }
        }
      });
    }
  </script>
</body>
</html>
