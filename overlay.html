<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDEX Timer</title>
  <style>
    :root {
      --gold: #d9a54a;
      --muted: #8b8f9d;
      --warning: #f39c12;
      --panel: rgba(10, 11, 15, 0.96);
      --border: rgba(217, 165, 74, 0.48);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #timer {
      width: calc(100% - 8px);
      height: calc(100% - 8px);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px 0 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px;
      box-shadow: 0 8px 28px rgba(0,0,0,.40), 0 0 18px rgba(217,165,74,.08);
      -webkit-app-region: drag;
      user-select: none;
    }
    #status {
      width: 7px; height: 7px; min-width: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 9px rgba(217,165,74,.8);
    }
    #time {
      font-family: "Courier New", monospace;
      font-size: 22px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-shadow: 0 0 12px rgba(217,165,74,.18);
    }
    #label {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .8px;
      color: var(--muted);
    }
    #hide {
      width: 24px;
      height: 30px;
      margin-left: auto;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    #hide:hover { color: #fff; background: rgba(255,255,255,.06); }
    .paused #status {
      background: var(--warning);
      box-shadow: 0 0 9px rgba(243,156,18,.65);
    }
    .paused #time { color: var(--warning); }
  </style>
</head>
<body>
  <div id="timer">
    <span id="status"></span>
    <span id="time">00:00:00</span>
    <span id="label">FOCUS</span>
    <button id="hide" title="Hide timer">x</button>
  </div>

  <script>
    const timer = document.getElementById('timer');
    const time = document.getElementById('time');
    const hide = document.getElementById('hide');

    hide.addEventListener('click', (event) => {
      event.stopPropagation();
      window.electronAPI.hideMiniTimer();
    });

    let dragging = false;
    let startMouseX = 0;
    let startMouseY = 0;
    let startWindowX = 0;
    let startWindowY = 0;

    timer.addEventListener('mousedown', async (event) => {
      if (event.target === hide) return;
      dragging = true;
      startMouseX = event.screenX;
      startMouseY = event.screenY;
      const pos = await window.electronAPI.getMiniTimerPosition();
      if (pos) {
        startWindowX = pos[0];
        startWindowY = pos[1];
      }
    });

    window.addEventListener('mousemove', (event) => {
      if (!dragging) return;
      const x = startWindowX + (event.screenX - startMouseX);
      const y = startWindowY + (event.screenY - startMouseY);
      window.electronAPI.moveMiniTimer(x, y);
    });

    window.addEventListener('mouseup', () => { dragging = false; });

    window.electronAPI.onMiniTimerState((state) => {
      time.textContent = state.time || '00:00:00';
      timer.classList.toggle('paused', !!state.paused);
    });
  </script>
</body>
</html>
